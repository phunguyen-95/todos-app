services:
  app:
    build: .
    ports: 
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/todos
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todos
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

  

